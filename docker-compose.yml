# Beyond AI — Docker Compose
# Full stack: Neo4j + yente (OpenSanctions) + Beyond AI API
# Compatible with existing Traefik setups

services:

  # ═══════════════════════════════════════════
  # Neo4j — Knowledge Graph
  # ═══════════════════════════════════════════
  neo4j:
    image: neo4j:5-community
    container_name: beyond-ai-neo4j
    ports:
      - "127.0.0.1:7474:7474"  # Browser
      - "127.0.0.1:7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/neo4j-import:/var/lib/neo4j/import
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
    restart: unless-stopped

  # ═══════════════════════════════════════════
  # yente — OpenSanctions Self-Hosted API
  # ═══════════════════════════════════════════
  yente:
    image: ghcr.io/opensanctions/yente:latest
    container_name: beyond-ai-yente
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      yente-es:
        condition: service_healthy
    environment:
      YENTE_INDEX_URL: http://elastic:${YENTE_ES_PASSWORD:?Set YENTE_ES_PASSWORD in .env}@yente-es:9200
      YENTE_MANIFEST: /data/manifest.yml
      # Für kommerzielle Nutzung: YENTE_DATA_TOKEN setzen
      # YENTE_DATA_TOKEN: ${OPENSANCTIONS_TOKEN:-}
    volumes:
      - ./data/yente:/data:ro
    restart: unless-stopped

  yente-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: beyond-ai-yente-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${YENTE_ES_PASSWORD:?Set YENTE_ES_PASSWORD in .env}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - yente_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ═══════════════════════════════════════════
  # Beyond AI API — FastAPI Backend
  # ═══════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beyond-ai-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - neo4j
      - yente
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      YENTE_URL: http://yente:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-kimi-k2.5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BEYOND_AI_AUTH_REQUIRED: ${BEYOND_AI_AUTH_REQUIRED:-true}
      BEYOND_AI_BASIC_AUTH_USER: ${BEYOND_AI_BASIC_AUTH_USER:?Set BEYOND_AI_BASIC_AUTH_USER in .env}
      BEYOND_AI_BASIC_AUTH_PASSWORD: ${BEYOND_AI_BASIC_AUTH_PASSWORD:?Set BEYOND_AI_BASIC_AUTH_PASSWORD in .env}
      BEYOND_AI_RATE_LIMIT_REQUESTS: ${BEYOND_AI_RATE_LIMIT_REQUESTS:-30}
      BEYOND_AI_RATE_LIMIT_WINDOW_SECONDS: ${BEYOND_AI_RATE_LIMIT_WINDOW_SECONDS:-60}
      BEYOND_AI_TRUST_PROXY_HEADERS: "false"
      BEYOND_AI_ALLOW_EXTERNAL_LLM_FALLBACK: ${BEYOND_AI_ALLOW_EXTERNAL_LLM_FALLBACK:-false}
    volumes:
      - ./shared:/app/shared
      - ./sanctions:/app/sanctions
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  yente_es_data:
