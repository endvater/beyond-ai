name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to package, e.g. v0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/beyond-ai-api

jobs:
  publish_api_image:
    name: Publish API image
    runs-on: ubuntu-latest
    env:
      IMAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.IMAGE_VERSION }}

      - name: Validate requested tag
        run: git describe --tags --exact-match >/dev/null

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint and test before publishing
        run: |
          pip install -r requirements.txt pytest pytest-asyncio httpx ruff
          ruff check .
          pytest sanctions/tests/ -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=semver,pattern={{version}},value=${{ env.IMAGE_VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.IMAGE_VERSION, '-') }}
          labels: |
            org.opencontainers.image.title=Beyond AI API
            org.opencontainers.image.description=Beyond AI Sanctions Screening API

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BEYOND_AI_VERSION=${{ env.IMAGE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
